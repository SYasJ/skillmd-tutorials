<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPal - Never Forget to Water Again</title>
    <style>
        body {
            background-color: #0b1020;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .brand-line {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .headline {
            font-family: "Anton", Impact, sans-serif;
            font-size: 80px;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
            padding: 0;
        }

        .underline {
            width: 100px;
            height: 10px;
            background-color: #22c55e;
            margin: 20px 0;
        }

        .description {
            font-size: 20px;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .badge {
            background-color: #facc15;
            color: #0b1020;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 40px;
            display: inline-block;
        }

        .button {
            background-color: #22c55e;
            color: #0b1020;
            text-decoration: none;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 18px;
            transition: opacity 0.2s;
            display: inline-block;
            margin-bottom: 60px;
        }

        .button:hover {
            opacity: 0.9;
        }

        .footer {
            font-size: 12px;
            color: #64748b;
            position: absolute;
            bottom: 20px;
        }

        @media (max-width: 600px) {
            .headline {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="brand-line">PlantPal</div>
    <h1 class="headline">KEEP YOUR PLANTS ALIVE</h1>
    <div class="underline"></div>
    <p class="description">The smart app that reminds you exactly when to water your plants.</p>
    <div class="badge">500 SLOTS OPEN</div>
    <a href="#" class="button">Get early access</a>
    <div class="footer">made with a SKILL.md</div>
</body>
</html>
